name: coderank
description: "A smart learning platform for ambitious students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/onboarding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#5F00FF"
  image: "assets/branding/splash_logo.png"

  android: true
  ios: true

  android_12:
    color: "#5F00FF"
    image: "assets/branding/splash_logo.png"