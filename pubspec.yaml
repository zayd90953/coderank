name: coderank
description: "A smart learning platform for ambitious students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.13.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.7
  google_sign_in: ^6.2.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/onboarding/
    - assets/icons/
    - assets/practice/diagrams/
    - assets/avatars/
    - lib/features/practice/data/questions.json


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  # Plain green backdrop matching the in-app SplashScreen
  # (ColorPalette.brandGreen primary) so the native window is invisible
  # while the engine boots — the only launch screen the user sees is the
  # Flutter one (logo + tagline). No image: the native phase is just the
  # solid color, otherwise it would appear as a second logo-only screen.
  color: "#39D353"

  android: true
  ios: true

  android_12:
    color: "#39D353"